services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baduka
      POSTGRES_USER: baduka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-before-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baduka -d baduka"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://baduka:${POSTGRES_PASSWORD:-local-only-change-before-production}@db:5432/baduka
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
